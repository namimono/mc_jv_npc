<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小杰 · 决策执行链路</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#19222e;--line:#2d3949;--muted:#97a9bd;--ink:#e5edf7;--accent:#65d4bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:23px;margin:0}h2{font-size:17px}p{margin:6px 0}.muted,small{color:var(--muted)}button,input,select,.button{font:inherit;border:1px solid var(--line);background:#202c3b;color:var(--ink);padding:7px 10px;border-radius:7px}button,.button{cursor:pointer}button:hover,.button:hover{border-color:var(--accent)}a{color:var(--accent)}.bar{padding:14px 28px;display:flex;gap:9px;flex-wrap:wrap}.bar input[type=search]{flex:1;min-width:220px}.stats{display:flex;gap:24px;padding:10px 28px;color:var(--muted)}.stats b{color:var(--ink);font-size:20px;margin-right:5px}main{display:grid;grid-template-columns:minmax(340px,42%) 1fr;height:calc(100vh - 258px);min-height:430px;border-top:1px solid var(--line)}#timeline{overflow:auto;border-right:1px solid var(--line);padding:12px}#details{overflow:auto;padding:22px 28px}.event{display:block;text-align:left;width:100%;margin-bottom:6px;padding:11px 14px;background:var(--panel)}.event.selected{border-color:var(--accent);background:#203b3d}.event strong{font-size:14px}.event .summary{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;color:var(--muted)}.chip{font-size:11px;border-radius:4px;padding:2px 5px;background:#2a3b50;margin-right:7px;color:#afcced}.error{color:#ffa68f}.ok{color:var(--accent)}.ids{overflow-wrap:anywhere;color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;margin:14px 0}.kv span{overflow-wrap:anywhere}pre{background:#0c121a;padding:14px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,SFMono-Regular,monospace}details{margin-top:14px}summary{cursor:pointer;font-weight:600}.candidate{padding:10px 0;border-bottom:1px solid var(--line)}.candidate .meter{height:5px;border-radius:4px;background:#293749;margin-top:7px}.meter i{display:block;height:100%;background:var(--accent)}.candidate small{display:block}#notice{padding:0 28px 10px;color:#f3c980}.empty{padding:35px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}#import{display:none}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}main{grid-template-columns:1fr;height:auto}#timeline{max-height:42vh}#details{min-height:500px}.bar,.stats{padding-left:14px;padding-right:14px}.stats{gap:12px;flex-wrap:wrap}}
</style></head><body>
<header><div><h1>小杰 <span class="muted">/ 决策执行链路</span></h1><p class="muted" id="session"></p></div><div class="toolbar"><label class="button" for="import">导入完整 JSONL</label><input type="file" id="import" accept=".jsonl,.json"><button id="export">导出筛选结果</button><button id="refresh">刷新</button><label><input type="checkbox" id="auto"> 自动刷新</label></div></header>
<div class="bar"><input type="search" id="search" placeholder="搜索玩家原话、工具、错误、请求 ID…" aria-label="搜索"><select id="npc" aria-label="NPC"><option value="">全部 NPC</option></select><select id="goal" aria-label="目标"><option value="">全部目标</option></select><select id="dialogue" aria-label="交流"><option value="">全部交流</option></select><select id="kind" aria-label="类型"><option value="">全部类型</option></select><label><input type="checkbox" id="errors"> 仅异常 / 未采用</label></div>
<div class="stats" id="stats"></div><div id="notice"></div><div class="bar" id="parts"></div>
<main><div id="timeline"></div><article id="details"><div class="empty">选择左侧事件，查看请求、结果和执行关联。</div></article></main>
<script>
'use strict';
const model = /*TRACE_DATA*/{};
const $=id=>document.getElementById(id),fields=['search','npc','goal','dialogue','kind','errors'];
let events=model.events||[],selected=null,imported=false,shown=200;
const goalScopes=new Map();
const key='jev-trace:'+model.session;let saved={};try{saved=JSON.parse(sessionStorage.getItem(key)||'{}')}catch(e){}
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el}
function isError(e){return /error|failed|stale|discard|reject|uncertain|cancel/.test(e.phase+' '+String(e.data?.outcome||'')+' '+String(e.data?.error||''))}
function save(){const state={selected,auto:$('auto').checked,detailScroll:$('details').scrollTop,listScroll:$('timeline').scrollTop};fields.forEach(f=>state[f]=$(f).type==='checkbox'?$(f).checked:$(f).value);try{sessionStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function options(){goalScopes.clear();for(const f of ['npc','goal','dialogue','kind']){const current=$(f).value||saved[f]||'';$(f).replaceChildren(node('option','全部'+({npc:' NPC',goal:'目标',dialogue:'交流',kind:'类型'}[f])));$(f).firstChild.value='';const values=[...new Set(events.map(e=>f==='kind'?e.kind:e.tags?.[f]).filter(v=>v!==undefined&&v!==''))];values.forEach(value=>{const opt=node('option',f==='goal'||f==='npc'?String(value).slice(0,8):value);opt.value=String(value);opt.title=String(value);$(f).append(opt)});$(f).value=current}}
function goalMatch(e,value){
  if(!goalScopes.has(value)){
    const starts=new Map(events.filter(x=>x.phase==='start').map(x=>[x.span,x]));
    const scope=new Set(),dialogues=new Set();
    for(const x of events.filter(x=>String(x.tags?.goal)===value)){
      scope.add(x.span);let cursor=starts.get(x.span),visited=new Set();
      while(cursor&&!visited.has(cursor.span)){
        visited.add(cursor.span);
        if(cursor.kind==='npc'||cursor.kind==='goal'&&String(cursor.tags?.goal)!==value)break;
        scope.add(cursor.span);if(cursor.kind==='dialogue')dialogues.add(cursor.span);
        cursor=starts.get(cursor.parent);
      }
    }
    for(const x of events){
      let cursor=starts.get(x.span),visited=new Set();
      while(cursor&&!visited.has(cursor.span)){
        visited.add(cursor.span);
        if(cursor.kind==='goal'||cursor.kind==='npc')break;
        if(dialogues.has(cursor.span)){scope.add(x.span);break;}
        cursor=starts.get(cursor.parent);
      }
    }
    goalScopes.set(value,scope);
  }
  return goalScopes.get(value).has(e.span);
}
function filtered(){const q=$('search').value.toLowerCase();return events.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&['npc','goal','dialogue','kind'].every(f=>!$(f).value||(f==='goal'?goalMatch(e,$(f).value):String(f==='kind'?e.kind:e.tags?.[f])===$(f).value))&&(!$('errors').checked||isError(e)))}
function short(e){const d=e.data||{};return d.outcome||d.summary||d.text||d.detail||d.error||d.choice||d.action?.description||d.purpose||d.method||d.code||''}
function select(seq){selected=seq;save();renderList();detail(events.find(e=>e.seq===seq))}
function renderList(){const list=filtered();$('timeline').replaceChildren();for(const e of list.slice(-shown).reverse()){const row=node('button',undefined,'event'+(selected===e.seq?' selected':''));row.dataset.seq=e.seq;const top=node('div');top.append(node('span','#'+e.seq,'chip'),node('strong',e.kind+' · '+e.phase,isError(e)?'error':''));row.append(top,node('div',short(e),'summary'),node('small',new Date(e.time).toLocaleTimeString()+(e.tags?.goal?' · 目标 '+e.tags.goal.slice(0,8):'')+(e.tags?.dialogue?' · 交流 '+e.tags.dialogue:'')));row.onclick=()=>select(e.seq);$('timeline').append(row)}if(list.length>shown){const more=node('button','再显示 200 条');more.onclick=()=>{shown+=200;renderList()};$('timeline').append(more)}if(!list.length)$('timeline').append(node('div','没有匹配的记录。','empty'));$('stats').replaceChildren();for(const [label,count] of [['事件',list.length],['Jev 请求',list.filter(e=>e.kind==='jev'&&e.phase==='request').length],['DeepSeek 请求',list.filter(e=>e.kind==='deepseek'&&e.phase==='request').length],['异常 / 未采用',list.filter(isError).length]]){const p=node('span');p.append(node('b',count),document.createTextNode(label));$('stats').append(p)}}
function raw(title,data,open=false){const box=node('details');box.open=open;box.append(node('summary',title),node('pre',JSON.stringify(data,null,2)));return box}
function jump(span){const target=events.find(e=>e.span===span);if(target)select(target.seq);else alert('关联事件位于其他分段。请导入本会话 events.jsonl 查看完整链路。')}
function detail(e){if(!e){$('details').replaceChildren(node('div','所选事件已移到历史分段。可打开上一分段或导入完整 JSONL。','empty'));return;}$('details').replaceChildren(node('h2',e.kind+' · '+e.phase));const kv=node('div',undefined,'kv');for(const [k,v] of Object.entries({时间:e.time,序号:e.seq,NPC:e.tags?.npc||'—',目标:e.tags?.goal||'—',交流:e.tags?.dialogue||'—',Span:e.span})){kv.append(node('span',k,'muted'),node('span',v))}$('details').append(kv);const links=node('div',undefined,'toolbar');if(e.parent){const p=node('button','↑ 父事件');p.onclick=()=>jump(e.parent);links.append(p)}const related=events.filter(x=>x.span===e.span||x.parent===e.span);for(const item of related.slice(0,35)){if(item.seq===e.seq)continue;const b=node('button','#'+item.seq+' '+item.kind+'/'+item.phase);b.onclick=()=>select(item.seq);links.append(b)}$('details').append(links);
const spanEvents=events.filter(x=>x.span===e.span),req=spanEvents.find(x=>x.phase==='request'),res=spanEvents.find(x=>x.phase==='response');
if(e.kind==='jev'){const question=req?.data?.input?.questions?.next_action,answer=res?.data?.output?.answers?.next_action;const section=node('section');section.append(node('h2','Jev 判断'));if(question)section.append(node('p',typeof question.instructions==='string'?question.instructions:JSON.stringify(question.instructions)));if(answer)section.append(node('p','选择：'+answer.choice+'　整次判断置信度：'+answer.confidence,'ok'));section.append(node('p','下方是各选项概率；confidence 是分布集中度，不是执行成功率。','muted'));for(const [id,description] of Object.entries(question?.criteria||{})){const p=answer?.probabilities?.[id],valid=typeof p==='number'&&Number.isFinite(p)&&p>=0&&p<=1;const c=node('div',undefined,'candidate');c.append(node('strong',(answer?.choice===id?'✓ ':'')+id+'　'+(valid?(p*100).toFixed(2)+'%':'未返回概率')),node('small',typeof description==='string'?description:JSON.stringify(description)));const bar=node('div',undefined,'meter');const fill=node('i');fill.style.width=(valid?p*100:0)+'%';bar.append(fill);c.append(bar);section.append(c)}if(!req)section.append(node('p','请求位于其他分段，请导入完整 JSONL。','muted'));$('details').append(section)}
if(req)$('details').append(raw('实际模型输入',req.data,true));if(res)$('details').append(raw('实际模型输出',res.data,true));$('details').append(raw('当前事件详情',e.data,true),raw('完整记录',e));}
function render(){renderList();detail(events.find(e=>e.seq===selected));}
options();for(const f of fields){if($(f).type==='checkbox')$(f).checked=!!saved[f];else if(saved[f]!==undefined)$(f).value=saved[f];$(f).addEventListener('input',()=>{shown=200;save();renderList()})}selected=saved.selected??events.at(-1)?.seq;$('auto').checked=model.live&&saved.auto!==false;
$('session').textContent='本机记录 · '+model.session+' · '+(model.live?'运行中':'已归档');$('notice').textContent=model.dropped?'记录队列曾丢弃 '+model.dropped+' 条事件，链路不完整。':'当前为分段 '+model.part+'；导入 events.jsonl 可跨全部分段检索。';
const parts=$('parts');for(const [label,href] of [['最新记录','index.html'],...(model.part>1?[['上一分段','part-'+String(model.part-1).padStart(4,'0')+'.html']]:[]),...(!model.live?[['下一分段（如已生成）','part-'+String(model.part+1).padStart(4,'0')+'.html']]:[])]){const a=node('a',label);a.href=href;parts.append(a)}const jsonl=node('a','原始 JSONL');jsonl.href='events.jsonl';jsonl.download='events.jsonl';parts.append(jsonl);
$('auto').onchange=save;$('refresh').onclick=()=>{save();location.reload()};
$('import').onchange=async()=>{const file=$('import').files[0];if(!file)return;try{const text=await file.text();let partial=false;const lines=text.split(/\r?\n/).filter(Boolean);const rows=lines.flatMap((line,i)=>{try{return [JSON.parse(line)]}catch(error){if(i===lines.length-1&&!text.endsWith('\n')){partial=true;return []}throw error}});if(!rows.length||rows.some(e=>e.schema!==1||!Number.isInteger(e.seq)||!e.kind||!e.data||typeof e.tags!=='object'||e.session!==rows[0].session))throw Error('请选择同一会话的版本 1 JSONL 文件');events=rows;imported=true;$('auto').checked=false;selected=rows.at(-1).seq;options();$('session').textContent='已导入 · '+file.name+' · '+rows[0].session;$('notice').textContent='完整文件已载入；共 '+rows.length+' 条。'+(partial?'末行尚未写完，已跳过；可稍后重新导入。':'')+(rows.some((e,i)=>i>0&&e.seq!==rows[i-1].seq+1)?'检测到序号缺口，部分记录可能丢失。':'');parts.hidden=true;render()}catch(error){$('notice').textContent='导入失败：'+error.message}};
$('export').onclick=()=>{const blob=new Blob([filtered().map(e=>JSON.stringify(e)).join('\n')+'\n'],{type:'application/x-ndjson'});const url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='jev-trace-filtered.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
setInterval(()=>{if(model.live&&!imported&&$('auto').checked&&!document.hidden){save();location.reload()}},3000);render();$('details').scrollTop=saved.detailScroll||0;$('timeline').scrollTop=saved.listScroll||0;
</script></body></html>
